<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حضور العمالة</title>
<link rel="stylesheet" href="style.css?v=4">
<link rel="stylesheet" href="reports.css?v=6">
<link rel="stylesheet" href="extra.css?v=6">
<link rel="stylesheet" href="gate.css?v=2">
</head>
<body>
<div id="gateOverlay">
  <div class="gate-box">
    <h2>دخول المشرفين</h2>
    <input id="gateInput" type="text" inputmode="numeric" placeholder="مفتاح الوصول" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div id="gateErr" class="gate-err"></div>
    <button id="gateBtn" class="btn-primary">دخول</button>
  </div>
</div>

<header class="topbar no-print">
  <h1>حضور العمالة</h1>
  <div id="clock" class="clock">--:--:--</div>
</header>

<main id="mainView">
  <div class="toolbar">
    <input id="search" type="search" placeholder="بحث بالاسم أو رقم البطاقة">
    <button id="addBtn" class="btn-primary" title="إضافة عامل">+</button>
  </div>
  <div class="subbar">
    <button id="undoBtn">↶ تراجع</button>
    <button id="logBtn">سجل العمليات</button>
    <button id="repBtn">التقارير</button>
  </div>
  <div class="subbar">
    <button id="backupBtn">⬇ نسخة احتياطية</button>
    <button id="restoreBtn">⬆ استيراد نسخة</button>
    <input type="file" id="restoreFile" accept="application/json" class="hide">
  </div>
  <div id="count" class="count"></div>
  <ul id="list" class="list"></ul>
</main>

<section id="reportView" class="rp-view hide">
  <div class="rp-row no-print">
    <button id="rpBack">← رجوع</button>
  </div>
  <div class="rp-row rp-tabs no-print">
    <button id="tabDay" class="active">يومي</button>
    <button id="tabMonth">شهري</button>
  </div>
  <div class="rp-row no-print">
    <input type="date" id="rpDate">
    <input type="month" id="rpMonth" class="hide">
  </div>
  <div class="rp-row no-print">
    <button id="rpPrint" class="btn-primary">طباعة / حفظ PDF</button>
    <button id="rpExcel">تصدير Excel</button>
  </div>
  <div class="paper">
    <h2 id="rpTitle"></h2>
    <div id="rpSub" class="rp-sub"></div>
    <div class="table-wrap"><table id="rpTable"></table></div>
  </div>
</section>

<dialog id="dlg">
  <form id="form">
    <h2>إضافة عامل</h2>
    <label>الاسم <input id="fName" required></label>
    <label>رقم البطاقة <input id="fCard" required></label>
    <div id="err" class="err"></div>
    <div class="actions">
      <button type="button" id="cancelBtn">إلغاء</button>
      <button type="submit" class="btn-primary">حفظ</button>
    </div>
  </form>
</dialog>

<dialog id="logDlg">
  <h2>سجل العمليات</h2>
  <ul id="logList" class="loglist"></ul>
  <div class="actions">
    <button type="button" id="logClose">إغلاق</button>
  </div>
</dialog>

<dialog id="delDlg">
  <h2>حذف العامل</h2>
  <div id="delName"></div>
  <p>سيختفي العامل من القائمة، وتفضل سجلاته ظاهرة في التقارير القديمة. تقدر تتراجع عن الحذف من زر "تراجع" في نفس اليوم.</p>
  <div class="actions">
    <button type="button" id="delCancel">إلغاء</button>
    <button type="button" id="delOk" class="btn-danger">حذف العامل</button>
  </div>
</dialog>

<div id="toast" class="toast"></div>

<script src="gate.js?v=6"></script>
<script src="db.js?v=9"></script>
<script src="app.js?v=9"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="reports.js?v=7"></script>
<script src="backup.js?v=3"></script>
</body>
</html>
